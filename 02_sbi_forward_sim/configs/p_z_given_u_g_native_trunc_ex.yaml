# Stage-z: shared mixture weights; 2D full-cov Gaussian on (x, e_y*) + von Mises(psi)
# + conditional truncated Normal on e_x | (x, e_y*, psi, u, g, p). No sampled theta_deg.

paths:
  z_train: "data_processed/z_train.parquet"
  z_calibration: "data_processed/z_calibration.parquet"
  z_test: "data_processed/z_test.parquet"
  context_master: "data_processed/sbi_context_event_master.parquet"
  standardization_stats: "manifests/standardization_stats.json"
  event_split_table: "data_processed/event_split_table.parquet"
  feature_contract: "configs/feature_contracts/p_z_given_u_g_feature_contract_v3.json"
  joint_train: "data_processed/joint_train.parquet"

targets:
  - x
  - psi_deg
  - e_y_star
  - e_x

upstream_u_features:
  - v_ss_tilde
  - a_tilde
  - d_tilde

numeric_context_features:
  - z_count
  - plate_x
  - plate_z
  - release_spin_rate
  - spin_axis_sin
  - spin_axis_cos
  - release_speed

player_constant_features:
  - bat_length_in
  - bat_weight_oz
  - x_cm_fixed_in
  - r_g_fixed_in
  - I0_oz_in2
  - Iz_oz_in2

categorical_features:
  batter_name: { embedding_dim: 16 }
  pitch_type: { embedding_dim: 8 }
  stand: { embedding_dim: 4 }
  p_throws: { embedding_dim: 4 }

weight_column: "combined_training_weight"

target_parameterization: "native_trunc_ex_vm"

eval:
  eval_splits_batch_size: 4096

training:
  seed: 42
  max_epochs: 35
  early_stopping_patience: 6
  early_stopping_metric: "calibration_weighted_nll"
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.0
  batch_events: 64
  max_draws_per_event: 16
  grad_clip: 5.0
  eval_calibration_every: 1

model:
  family: "hybrid_gauss_vonmises_trunc_ex"
  n_components: 5
  hidden_width: 64
  hidden_layers: 2
  activation: "tanh"
  chol_eps: 1.0e-5
  kappa_floor: 1.0e-3
  sigma_floor: 1.0e-3

calibration:
  max_iter: 400
  lr: 0.05
  anisotropic_gaussian: false

outputs:
  run_dir: "outputs/p_z_given_u_g"
